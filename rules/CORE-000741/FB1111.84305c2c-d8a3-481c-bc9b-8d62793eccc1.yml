Check:
  all:
    - name: $STYPE_INTERVENTIONAL
      operator: greater_than_or_equal_to
      value: 1
    - any:
        - name: TSPARMCD
          operator: not_contains_all
          value:
            - INTMODEL
            - INTTYPE
            - PCLAS
          value_is_literal: true
        - any:
            - all:
                - name: TSPARMCD
                  operator: equal_to
                  value: INTMODEL
                  value_is_literal: true
                - name: TSVAL
                  operator: empty
            - all:
                - name: TSPARMCD
                  operator: equal_to
                  value: INTTYPE
                  value_is_literal: true
                - name: TSVAL
                  operator: empty
            - all:
                - name: TSPARMCD
                  operator: equal_to
                  value: PCLAS
                  value_is_literal: true
                - name: TSVAL
                  operator: empty
Core:
  Status: Published
  Version: '1'
  Id: CORE-000741
Description: The set  ('INTMODEL’, 'INTTYPE','PCLAS') is not in the list of
  TSPARAMCD with TSVAL populated.
Executability: Fully Executable
Operations:
  - filter:
      TSPARMCD: STYPE
      TSVAL: INTERVENTIONAL
    id: $STYPE_INTERVENTIONAL
    operator: record_count
Outcome:
  Message: The set  ('INTMODEL’, 'INTTYPE','PCLAS') is not in the list of
    TSPARAMCD with TSVAL populated.
  Output Variables:
    - TSPARMCD
    - TSVAL
    - $STYPE_INTERVENTIONAL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - TS
Sensitivity: Dataset
